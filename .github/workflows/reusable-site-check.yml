# Reusable site check — uptime + broken-link check for a live homepage.
# Meant for a daily schedule, so a failing run shows up as a red workflow on
# main (and in workspace-tools' `make meta` "CI green" check).
#
#   on:
#     schedule:
#       - cron: '20 7 * * *'
#     workflow_dispatch:
#
#   jobs:
#     site-check:
#       uses: and3rn3t/.github/.github/workflows/reusable-site-check.yml@v1
#       with:
#         url: https://andernet.dev
#
# The `lighthouse` job (on by default; `lighthouse: false` to skip) runs one
# mobile Lighthouse pass and uploads a `lighthouse` artifact holding
# lighthouse.json — consumed by the workspace dashboard via the Actions
# artifacts API:
#
#   {
#     "url": "https://andernet.dev",
#     "timestamp": "2026-10-21T07:20:00Z",
#     "performance": 97, "accessibility": 100,
#     "best-practices": 100, "seo": 92
#   }
#
# Scores are 0–100 integers, or null if Lighthouse could not score a category.

name: Reusable Site Check

on:
  workflow_call:
    inputs:
      url:
        description: Homepage URL to check.
        required: true
        type: string
      extra-lychee-args:
        description: Extra lychee arguments appended to the defaults (e.g. more --exclude patterns).
        required: false
        default: ''
        type: string
      lighthouse:
        description: Run a mobile Lighthouse audit and upload its scores as the `lighthouse` artifact.
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  # Static "site-check-" prefix: github.workflow is the caller's name, so an
  # unprefixed group could collide with another reusable workflow called from
  # the same caller (see the reusable-node-verify.yml fix).
  group: site-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uptime:
    name: Homepage returns 200
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check HTTP status
        env:
          SITE_URL: ${{ inputs.url }}
        run: |
          status=$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' \
            --retry 4 --retry-delay 15 --retry-all-errors --max-time 30 \
            --user-agent 'and3rn3t-site-check (+https://github.com/and3rn3t/.github)' \
            "$SITE_URL") || true
          echo "$SITE_URL -> HTTP ${status:-none}"
          if [ "$status" != "200" ]; then
            echo "::error title=Site down::$SITE_URL returned HTTP ${status:-none} (expected 200)"
            exit 1
          fi

  links:
    name: Broken links on homepage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # lychee is not recursive: given a URL it fetches that one page and
      # checks every link on it — i.e. a depth-1 crawl of the homepage.
      # Social sites that block bots (999/403/429 for unauthenticated
      # clients) are excluded so they don't produce false alarms, as are
      # Cloudflare's obfuscated email links (/cdn-cgi/l/email-protection, a
      # 404 by design) and form endpoints that only accept POST (formspree,
      # getform, basin, web3forms).
      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --accept 200..=299,429
            --exclude '^https?://([a-z0-9-]+\.)?(linkedin\.com|twitter\.com|x\.com|facebook\.com|instagram\.com|tiktok\.com|threads\.net|reddit\.com)'
            --exclude '/cdn-cgi/l/email-protection'
            --exclude '^https://(formspree\.io|getform\.io|usebasin\.com|api\.web3forms\.com)/'
            ${{ inputs.extra-lychee-args }}
            '${{ inputs.url }}'
          fail: true
          jobSummary: true
          token: ${{ github.token }}

  lighthouse:
    name: Lighthouse scores
    if: inputs.lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Lighthouse emulates a mobile device by default; the config makes that
      # explicit. No checkout — the config lives in the runner's temp dir.
      - name: Write Lighthouse config
        run: |
          cat > "$RUNNER_TEMP/lighthouserc.json" <<'JSON'
          {"ci": {"collect": {"settings": {"formFactor": "mobile"}}}}
          JSON

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: ${{ inputs.url }}
          runs: 1
          configPath: ${{ runner.temp }}/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Write lighthouse.json
        env:
          SITE_URL: ${{ inputs.url }}
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --arg url "$SITE_URL" --arg timestamp "$timestamp" '
            def pct: if . == null then null else (. * 100 | round) end;
            (map(select(.isRepresentativeRun)) | first // .[0]).summary as $s
            | {
                url: $url,
                timestamp: $timestamp,
                performance: ($s.performance | pct),
                accessibility: ($s.accessibility | pct),
                "best-practices": ($s["best-practices"] | pct),
                seo: ($s.seo | pct)
              }
          ' <<<"$MANIFEST" > lighthouse.json
          cat lighthouse.json
          {
            echo "### Lighthouse (mobile) — $SITE_URL"
            echo
            echo "| Category | Score |"
            echo "|---|---|"
            jq -r 'del(.url, .timestamp) | to_entries[] | "| \(.key) | \(.value // "n/a") |"' lighthouse.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lighthouse artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: lighthouse.json
          retention-days: 30
          if-no-files-found: error
